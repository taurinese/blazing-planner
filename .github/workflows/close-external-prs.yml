# The code is public for transparency, but outside contributions are not accepted.
# Pull requests from anyone who is not a collaborator get a polite comment and are closed.
# Safe with pull_request_target: no code from the PR is checked out or run.
name: Close external pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR" --comment "Thanks for your interest! This project does not accept pull requests. Feel free to open an issue with a bug report or a data correction, or fork the project (MIT licence). / Merci ! Ce projet n'accepte pas de pull requests : ouvre plutôt une issue (bug ou correction de données), ou forke le projet."
